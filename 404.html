<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo_lmi_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ระบบบันทึกงานช่างและจัดส่งสินค้า - LMI & NNAP Field Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // 1. ป้องกันปัญหาเปิดบน GitHub Pages โดยไม่มีเครื่องหมาย slash ท้าย URL ซึ่งจะทำให้ relative path ./assets/ หาไม่เจอ
      if (location.pathname.split('/').length > 2 && !location.pathname.endsWith('/') && !location.pathname.includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
      // 2. จับ Error แสดงผลบนหน้าจอทันทีหากเกิดข้อผิดพลาด ป้องกันปัญหาจอขาว
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.indexOf('error-box') === -1)) {
          var errDiv = document.createElement('div');
          errDiv.className = 'error-box';
          errDiv.style = 'padding: 24px; margin: 30px auto; max-width: 480px; background: #ffffff; border: 1px solid #fecdd3; border-radius: 20px; font-family: sans-serif; color: #9f1239; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);';
          errDiv.innerHTML = '<div style="font-size: 32px; margin-bottom: 8px;">⚠️</div><h3 style="margin:0 0 8px 0; font-size: 16px; font-weight: bold; color: #1e293b;">กำลังโหลดระบบ หรือเกิดข้อผิดพลาด</h3><p style="font-size: 12px; margin: 4px 0 16px 0; color: #e11d48; line-height: 1.5; font-family: monospace; background: #fff1f2; padding: 8px 12px; border-radius: 8px;">' + (e.message || 'Script Loading Error') + '</p><button onclick="location.reload()" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px;">กดรีเฟรชหน้านี้</button>';
          root.appendChild(errDiv);
        }
      });
    </script>
    <script type="module" crossorigin src="./index.js"></script>
    <link rel="stylesheet" crossorigin href="./index.css">
  </head>
  <body class="bg-slate-50 text-slate-800 font-['Prompt',sans-serif] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <!-- Loading indicator while React initializes -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: sans-serif;">
        <div style="width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 18px; font-size: 15px; font-weight: bold; letter-spacing: 0.3px;">ระบบ Logistics & Field Service (LMI & NNAP)</p>
        <p id="loading-subtext" style="margin-top: 6px; font-size: 12px; color: #94a3b8;">กำลังเตรียมความพร้อมของระบบ...</p>
        <style>@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var subtext = document.getElementById('loading-subtext');
        if (subtext) {
          subtext.innerHTML = 'กำลังโหลดสคริปต์... หากรอนานเกินไป <a href="javascript:location.reload(true)" style="color:#38bdf8;text-decoration:underline;">คลิกตรงนี้เพื่อโหลดใหม่</a>';
        }
      }, 4000);
    </script>
  </body>
</html>
